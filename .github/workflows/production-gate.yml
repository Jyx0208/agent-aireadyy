name: Production Contract Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/production-gate.yml"
      - "pyproject.toml"
      - "scripts/**"
      - "src/agent/control_plane/**"
      - "src/agent/discovery/**"
      - "tests/test_discovery_*.py"
      - "tests/test_lab_https_signer.py"
      - "tests/test_l3_evidence_collection.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-gate.yml"
      - "pyproject.toml"
      - "scripts/**"
      - "src/agent/control_plane/**"
      - "src/agent/discovery/**"
      - "tests/test_discovery_*.py"
      - "tests/test_lab_https_signer.py"
      - "tests/test_l3_evidence_collection.py"

permissions:
  contents: read

jobs:
  production-contract-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Create clean virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,web,agents-sdk]"

      - name: Run production contract gate
        shell: pwsh
        run: .\scripts\run_production_gate.ps1

      - name: Record non-GO scope
        if: always()
        shell: pwsh
        run: |
          Write-Host "This workflow validates code/local-lab contracts only."
          Write-Host "It does not provide KMS/HSM, shared-volume, live-repository, or product-GO evidence."
