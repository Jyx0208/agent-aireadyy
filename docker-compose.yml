services:
  web:
    build: .
    container_name: pride-agent-web
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AGENT_LLM_BASE_URL=${AGENT_LLM_BASE_URL:-https://api.deepseek.com}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL:-deepseek-v4-flash}
      - AGENT_LLM_TIMEOUT=${AGENT_LLM_TIMEOUT:-1200}
      - AGENT_MAX_CONCURRENT_TASKS=${AGENT_MAX_CONCURRENT_TASKS:-2}
      - AGENT_SEARCH_THREADS=${AGENT_SEARCH_THREADS:-10}
      - AGENT_FRAGPIPE_RAM_GB=${AGENT_FRAGPIPE_RAM_GB:-0}
      - AGENT_RESULT_RETENTION_SECONDS=${AGENT_RESULT_RETENTION_SECONDS:-1800}
      - AGENT_MAX_RESULT_PROJECTS=${AGENT_MAX_RESULT_PROJECTS:-4}
      - AGENT_WEB_FULL_WORKFLOW_ENABLED=${AGENT_WEB_FULL_WORKFLOW_ENABLED:-0}
      - AGENT_PRIDE_CACHE_DIR=${AGENT_PRIDE_CACHE_DIR:-/app/.agent_cache/pride}
      - AGENT_IPROX_INDEX_XLSX=${AGENT_IPROX_INDEX_XLSX:-/app/data/iprox.xlsx}
      - AGENT_ZIP_COMPRESS_LEVEL=${AGENT_ZIP_COMPRESS_LEVEL:-6}
      - AGENT_CONTAINER_RUNS_DIR=/app/runs
      - AGENT_HOST_RUNS_DIR=${AGENT_HOST_RUNS_DIR:-/opt/pride-agent/runs}
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ./runs:/app/runs
      - ./.agent_cache:/app/.agent_cache
      - ${AGENT_IPROX_HOST_XLSX:-./iProx数据(1).xlsx}:/app/data/iprox.xlsx:ro
    restart: unless-stopped
