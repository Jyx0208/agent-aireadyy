[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pride-ai-ready-agent"
version = "0.1.2"
description = "PRIDE-first AI-ready data agent aligned with MSDT-Converter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=45,<50",
  "httpx>=0.27,<0.29",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<2.3",
  "pyarrow>=16,<19",
  "pydantic>=2.8,<3",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
agents-sdk = [
  "openai-agents==0.18.1",
]
dev = [
  "pytest>=8.2,<9",
]
dataset-construction = [
  "duckdb>=1.4,<2",
  "pandera[pandas]>=0.26,<1",
  "psm-utils>=1.5,<2",
  "prov>=2.1,<3",
  "rocrate>=0.14,<1",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "sdrf-pipelines>=0.0.34,<1",
]
dataset-construction-ortools-worker = [
  "ortools>=9.14,<10",
]
web = [
  "alembic>=1.18.5,<2",
  "anthropic>=0.75,<1",
  "fastapi>=0.115,<1",
  "huey>=3.2.1,<4",
  "openai-agents==0.18.1",
  "openai>=2.45,<3",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0.51,<2.1",
  "sse-starlette>=3.4.5,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
pride-agent = "agent.cli:app"
pride-dataset = "agent.dataset_construction.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
force-include = { "profiles" = "profiles" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = '-m "not future_project"'
markers = [
  "future_project: contracts for the not-yet-implemented Project orchestration product wave",
]
