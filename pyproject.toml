[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pride-ai-ready-agent"
version = "0.1.2"
description = "PRIDE-first AI-ready data agent aligned with MSDT-Converter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27,<0.29",
  "pandas>=2.2,<2.3",
  "pyarrow>=16,<19",
  "pydantic>=2.8,<3",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
agents-sdk = [
  "openai-agents==0.18.1",
]
dev = [
  "pytest>=8.2,<9",
]
web = [
  "anthropic>=0.75,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
pride-agent = "agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
force-include = { "profiles" = "profiles" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
